<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인 · 날씨와 안전수칙</title><style>.manager-messages{font-family:system-ui,'Malgun Gothic',sans-serif;border:1px solid #cce2d4;border-radius:14px;background:#fff;color:#18331f;margin-bottom:10px;font-size:13px}.manager-panel>summary{padding:13px 14px;cursor:pointer;font-weight:750;font-size:14px}.manager-content{padding:0 14px 14px}.manager-mode{display:inline-block;font-size:11px;color:#835817;background:#fff4da;border-radius:6px;padding:5px 8px;margin:0 0 6px}.manager-help{display:block;font-size:12px;line-height:1.65;color:#617064;margin:7px 0}.manager-compose{border-top:1px solid #e3ece6;padding-top:8px}.manager-compose>summary{cursor:pointer;font-weight:700;padding:8px 0}.manager-messages label{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-weight:650}.manager-messages input,.manager-messages select,.manager-messages textarea{box-sizing:border-box;max-width:100%;width:100%;font:16px/1.5 system-ui;border:1px solid #c8d9ce;border-radius:9px;background:white;color:#18331f;padding:10px}.manager-messages textarea{resize:vertical;min-height:120px}.manager-actions{display:flex;gap:8px;flex-wrap:wrap}.manager-messages button{border:0;border-radius:9px;padding:11px 13px;min-height:42px;background:#e8f3ec;color:#17673a;font:650 12px system-ui;cursor:pointer}.manager-messages .manager-submit{background:#16733f;color:white}.manager-messages button:disabled{opacity:.6;cursor:default}.manager-count{text-align:right;font-size:11px;color:#617064;margin-top:-5px}.manager-inbox{margin-top:16px;padding-top:10px;border-top:1px solid #e3ece6}.manager-inbox h3{font-size:14px;margin:0}.manager-notice{border:1px solid #dae8df;border-radius:10px;padding:12px;margin:10px 0}.manager-notice h4{font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}.manager-notice small{font-size:10px;color:#617064}.manager-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.manager-message-status{font-size:12px;color:#16733f;line-height:1.65;min-height:1em}.manager-messages :focus-visible{outline:3px solid #16733f;outline-offset:2px}

.manager-admin-entry{padding:13px 14px;font-size:14px;font-weight:750;cursor:pointer}.manager-connection,.manager-live-status{font-size:12px;line-height:1.6;color:#17673a}.manager-live [hidden]{display:none!important}.manager-user{font-size:12px;overflow-wrap:anywhere}

*{box-sizing:border-box}body{margin:0;background:#f1f6f3;color:#18331f;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:680px;margin:32px auto;padding:16px}h1{font-size:24px;margin:5px 0 12px}.intro{color:#617064;line-height:1.7;font-size:14px}.manager-receiver,.briefing-card{display:none}.manager-messages{margin-top:20px}.manager-admin>summary{font-size:17px}a{color:#17673a}footer{font-size:12px;color:#617064;line-height:1.7;margin-top:18px}.manager-history h3{font-size:15px}</style></head><body><main><small>날씨와 안전수칙</small><h1>관리자 지역 공지</h1><p class="intro">관리자 계정으로 로그인한 뒤 대상 지역과 음성으로 전달할 메시지를 입력해 주세요.</p><div id="root"><div class="briefing-card" hidden></div></div><footer>위치가 확인된 지역의 앱에서만 자동 안내합니다. 수신 서비스와 위치 권한이 필요합니다.<br><a href="https://nanwook2009.github.io/weather-safety-demo/">날씨 시연페이지로 돌아가기</a></footer></main><script>/* Public Firebase configuration; database rules enforce access. */
window.weatherManagerConfig = Object.freeze({"firebaseApiKey": "AIzaSyATjNxOTC1kpi3oLEU6RTe7b0XVsH2y7EQ", "projectId": "weather-safety-aa4af", "databaseURL": "https://weather-safety-aa4af-default-rtdb.asia-southeast1.firebasedatabase.app"});
</script><script>(() => {
  'use strict';
  const config=window.weatherManagerConfig||{};
  const REGIONS={seoul:'서울',incheon:'인천',gyeonggi:'경기',busan:'부산',daegu:'대구',gwangju:'광주',daejeon:'대전',ulsan:'울산',sejong:'세종',gangwon:'강원',chungbuk:'충북',chungnam:'충남',jeonbuk:'전북',jeonnam:'전남',gyeongbuk:'경북',gyeongnam:'경남',jeju:'제주'};
  const configured=/^AIza[\w-]{30,}$/.test(config.firebaseApiKey||'')&&/^https:\/\/[a-z0-9-]+\.asia-southeast1\.firebasedatabase\.app$/.test(config.databaseURL||'');
  let session=null,busy=false,pending=null,loginVersion=0;
  const host=document.createElement('section');host.className='manager-messages manager-live';
  host.innerHTML=`<details class="manager-receiver"><summary class="manager-admin-entry">GPS 지역 공지 · 음성 수신</summary><div class="manager-content"><p class="manager-receiver-state" role="status"></p><div class="manager-actions"><button type="button" class="manager-start">GPS 지역 공지 수신 켜기</button><button type="button" class="manager-stop">수신 끄기</button></div><p class="manager-help">현재 GPS가 확인된 지역의 공지만 음성으로 안내합니다. 수신 중에는 알림이 표시되며 백그라운드 위치 확인을 계속합니다. 위치 권한이 없거나 2분 이상 위치를 확인하지 못하면 음성을 재생하지 않습니다.</p><p class="manager-last"></p><button type="button" class="manager-replay">최근 공지 다시 듣기</button></div></details><details class="manager-admin"><summary class="manager-admin-entry">관리자 모드 · 지역 공지 보내기</summary><div class="manager-content"><p class="manager-connection" role="status"></p><form class="manager-login"><label>관리자 ID (이메일)<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button type="submit">관리자 로그인</button><p class="manager-help">관리자 비밀번호는 기기에 저장하지 않습니다.</p></form><section class="manager-authenticated" hidden><div class="manager-actions"><strong class="manager-user"></strong><button class="manager-logout" type="button">로그아웃</button></div><form class="manager-send"><label>대상 GPS 지역<select name="region" required></select></label><label>공지 제목<input name="title" required maxlength="50" placeholder="예: 실외 작업 폭염 주의"></label><label>음성으로 전달할 메시지<textarea name="body" required maxlength="700" rows="4" placeholder="안내할 행동요령을 입력해 주세요."></textarea></label><label>자동 안내 유효시간<select name="ttl"><option value="1800000">발송 후 30분</option><option value="3600000">발송 후 1시간</option><option value="300000">발송 후 5분</option></select></label><p class="manager-help">선택 지역의 GPS가 확인되고 공지 수신을 켠 앱에 전달합니다. 서버 저장 성공과 휴대폰별 음성 재생 성공은 구분됩니다.</p><div class="manager-actions"><button class="manager-listen" type="button">음성 미리 듣기</button><button class="manager-submit" type="submit">해당 지역에 공지 발송</button></div></form><div class="manager-history"><h3>발송 내역</h3><button class="manager-refresh" type="button">내역·재생 결과 새로고침</button><div class="manager-history-list"></div></div></section><p class="manager-live-status" role="status" aria-live="polite"></p></div></details>`;
  const $=s=>host.querySelector(s),form=$('.manager-send'),login=$('.manager-login');
  $('.manager-connection').textContent=configured?'지역별 공지 서버 연결됨':'메시지 서버 연결 준비 중';
  login.querySelector('button').disabled=!configured;
  const report=t=>{$('.manager-live-status').textContent=t;};
  async function request(url,options={}){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);
    try{const response=await fetch(url,{...options,cache:'no-store',signal:controller.signal});const data=await response.json().catch(()=>null);if(!response.ok)throw new Error(response.status===401||response.status===403?'인증 또는 지역 발송 권한을 확인해 주세요.':'서버 요청에 실패했습니다. 잠시 후 다시 시도해 주세요.');return data;}finally{clearTimeout(timeout);}
  }
  function endpoint(path,query=''){return `${config.databaseURL}/${path}.json?auth=${encodeURIComponent(session.token)}${query}`;}
  function active(){if(!session||Date.now()>=session.expiresAt){logout('로그인 시간이 만료되었습니다. 다시 로그인해 주세요.');return false;}return true;}
  function logout(text='로그아웃했습니다.'){loginVersion++;session=null;pending=null;$('.manager-authenticated').hidden=true;login.hidden=false;$('.manager-user').textContent='';$('.manager-history-list').replaceChildren();form.reset();report(text);}
  function message(){const region=form.elements.region.value,title=form.elements.title.value.trim(),body=form.elements.body.value.trim();if(!session?.regions.includes(region))throw new Error('허가된 대상 지역을 선택해 주세요.');if(!title||title.length>50||!body||body.length>700)throw new Error('제목은 1~50자, 메시지는 1~700자로 입력해 주세요.');return {region,title,body,authorUid:session.uid,createdAt:{'.sv':'timestamp'},maxAgeMs:Number(form.elements.ttl.value)};}
  login.onsubmit=async event=>{
    event.preventDefault();if(!configured||busy)return;const version=++loginVersion;busy=true;login.querySelector('button').disabled=true;report('관리자 권한을 확인하고 있습니다.');
    try{const auth=await request(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(config.firebaseApiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:login.elements.email.value.trim(),password:login.elements.password.value,returnSecureToken:true})});
      const expiry=Number(auth.expiresIn);if(!auth.idToken||!auth.localId||!Number.isFinite(expiry)||expiry<=60)throw new Error('로그인 응답을 확인할 수 없습니다.');
      const role=await request(`${config.databaseURL}/admins/${encodeURIComponent(auth.localId)}.json?auth=${encodeURIComponent(auth.idToken)}`);
      const allowed=Object.keys(REGIONS).filter(r=>role?.regions?.[r]===true);if(role?.enabled!==true||!allowed.length)throw new Error('관리자로 등록된 계정이 아닙니다.');if(version!==loginVersion)return;
      session={uid:auth.localId,token:auth.idToken,expiresAt:Date.now()+(expiry-60)*1000,regions:allowed};form.elements.region.replaceChildren();for(const region of allowed){const option=document.createElement('option');option.value=region;option.textContent=REGIONS[region];form.elements.region.append(option);}
      $('.manager-user').textContent=login.elements.email.value.trim();login.hidden=true;$('.manager-authenticated').hidden=false;report('관리자 모드입니다. 실제 발송 전 대상 GPS 지역과 내용을 확인해 주세요.');
    }catch(e){if(version===loginVersion)logout(e.message);}finally{login.elements.password.value='';busy=false;login.querySelector('button').disabled=!configured;}
  };
  $('.manager-logout').onclick=()=>logout();
  $('.manager-listen').onclick=()=>{try{if(!active())return;const data=message();window.dispatchEvent(new CustomEvent('weather-briefing-speak',{detail:{text:`${REGIONS[data.region]} 지역 관리자 공지입니다. ${data.title}. ${data.body}`}}));report('음성 미리 듣기를 요청했습니다. 아직 발송하지 않았습니다.');}catch(e){report(e.message);}};
  form.onsubmit=async event=>{
    event.preventDefault();if(busy||!active())return;let data;try{data=message();}catch(e){report(e.message);return;}
    const signature=JSON.stringify({...data,createdAt:null});if(!pending||pending.signature!==signature)pending={id:crypto.randomUUID(),signature,data};
    const item=pending,version=loginVersion;busy=true;$('.manager-submit').disabled=true;report('지역 공지를 발송하고 있습니다.');
    try{let saved;try{saved=await request(endpoint(`notices/${data.region}/${item.id}`),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.data)});}catch(error){const existing=await request(endpoint(`notices/${data.region}/${item.id}`)).catch(()=>null);if(existing?.title!==data.title||existing?.body!==data.body||existing?.authorUid!==session?.uid||existing?.maxAgeMs!==data.maxAgeMs)throw error;saved=existing;}
      if(version!==loginVersion)return;pending=null;report(`${REGIONS[data.region]} 공지를 서버에 저장했습니다. 공지 수신을 켠 해당 지역 앱에서 안내합니다. 휴대폰별 재생 여부는 내역에서 확인해 주세요.`);form.elements.title.value='';form.elements.body.value='';try{await history();}catch{report(`${REGIONS[data.region]} 공지는 서버에 저장됐습니다. 내역 조회만 실패했으므로 다시 발송하지 말고 내역 새로고침을 눌러 주세요.`);}
    }catch(e){if(version===loginVersion)report(e.message+' 같은 내용으로 다시 누르면 동일 공지 ID로 확인하여 중복 저장을 방지합니다.');}finally{busy=false;$('.manager-submit').disabled=false;}
  };
  async function history(){
    if(!active())return;const region=form.elements.region.value;if(!session.regions.includes(region))return;const version=loginVersion;
    const [notices,receipts]=await Promise.all([request(endpoint(`notices/${region}`,'&orderBy=%22createdAt%22&limitToLast=10')),request(endpoint(`receipts/${region}`)).catch(()=>null)]);if(version!==loginVersion)return;
    const list=$('.manager-history-list');list.replaceChildren();const entries=Object.entries(notices||{}).sort((a,b)=>b[1].createdAt-a[1].createdAt);
    if(!entries.length){const p=document.createElement('p');p.className='manager-help';p.textContent='이 지역의 발송 내역이 없습니다.';list.append(p);}
    for(const [id,n]of entries){const article=document.createElement('article');article.className='manager-notice';const title=document.createElement('h4');title.textContent=n.title;const body=document.createElement('p');body.className='manager-body';body.textContent=n.body;const meta=document.createElement('small');const values=Object.values(receipts?.[id]||{});const spoken=values.filter(x=>x.status==='spoken').length;meta.textContent=`${REGIONS[region]} · ${new Date(n.createdAt).toLocaleString('ko-KR')} · 수신 보고 ${values.length}대 / 음성 완료 보고 ${spoken}대`;article.append(title,meta,body);list.append(article);}
  }
  $('.manager-refresh').onclick=()=>history().catch(e=>report(e.message));form.elements.region.onchange=()=>{pending=null;history().catch(e=>report(e.message));};
  function nativeState(){try{return window.ManagerMessages?JSON.parse(window.ManagerMessages.status()):null;}catch{return null;}}
  function receiver(){const state=nativeState();$('.manager-start').disabled=!state;$('.manager-stop').disabled=!state?.enabled;$('.manager-replay').disabled=!state?.lastText;
    $('.manager-receiver-state').textContent=state?(state.message||'GPS 지역 공지 수신 꺼짐'):'GPS 기반 음성 수신은 새 Android 앱에서 사용할 수 있습니다. 웹에서는 관리자 로그인과 발송을 이용할 수 있습니다.';$('.manager-last').textContent=state?.lastText?`최근 공지: ${state.lastText}`:'';}
  $('.manager-start').onclick=()=>{window.ManagerMessages?.start();setTimeout(receiver,500);};$('.manager-stop').onclick=()=>{window.ManagerMessages?.stop();receiver();};$('.manager-replay').onclick=()=>{const state=nativeState();if(state?.lastText)window.dispatchEvent(new CustomEvent('weather-briefing-speak',{detail:{text:state.lastText}}));};
  window.addEventListener('manager-message-status',receiver);window.addEventListener('focus',receiver);
  function mount(){const card=document.querySelector('.briefing-card');if(card&&host.parentElement!==card.parentElement){card.after(host);receiver();if(new URLSearchParams(location.search).get('manager')==='1')$('.manager-admin').open=true;}}
  mount();const root=document.getElementById('root');if(root)new MutationObserver(mount).observe(root,{childList:true,subtree:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)receiver();});
  setInterval(()=>{if(!document.hidden&&host.isConnected)receiver();},5000);
})();
</script><script>
document.querySelector('.manager-admin').open=true;
let adminSpeech;
window.addEventListener('weather-briefing-speak',event=>{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();adminSpeech=new SpeechSynthesisUtterance(event.detail.text);adminSpeech.lang='ko-KR';adminSpeech.rate=.92;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));if(voice)adminSpeech.voice=voice;window.speechSynthesis.speak(adminSpeech);});
</script></body></html>
